# ============================================
# GitHub Actions Playground - Learning Workflow
# ============================================
# This workflow is designed for learning GitHub Actions basics.
# It builds a debug APK of the Flutter app and uploads it as an artifact.
# This workflow does NOT publish to Google Play or any external service.
# ============================================

# Name of the workflow that appears in the Actions tab
name: Playground - Learn GitHub Actions

# ============================================
# Trigger: When does this workflow run?
# ============================================
on:
  # Run on every push to the main branch
  push:
    branches:
      - main

  # Optional: Allow manual triggering from the Actions tab
  workflow_dispatch:

# ============================================
# Jobs: The tasks to run
# ============================================
jobs:
  # Job name: build-and-learn
  # This job will build the APK and demonstrate GitHub Actions concepts
  build-and-learn:
    # The type of runner to run the job on
    # ubuntu-latest is a Linux virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    # Job steps: The individual actions that run in sequence
    steps:
      # ============================================
      # Step 1: Checkout the repository
      # ============================================
      # This action checks out your repository under $GITHUB_WORKSPACE,
      # so your workflow can access it.
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # Step 2: Print runner information
      # ============================================
      # This step demonstrates basic shell commands in GitHub Actions.
      # We use the 'run' keyword to execute shell commands.
      # ============================================
      - name: Print runner information
        run: |
          echo "=========================================="
          echo "STEP: Printing Runner Information"
          echo "=========================================="
          echo ""
          echo "Current directory:"
          pwd
          echo ""
          echo "Current user:"
          whoami
          echo ""
          echo "Operating system:"
          uname -a
          echo ""
          echo "List project files:"
          ls -la
          echo ""
          echo "=========================================="

      # ============================================
      # Step 3: Set up Java
      # ============================================
      # Flutter requires Java to build Android apps.
      # We use the official Java setup action from GitHub.
      # Java 17 is recommended for modern Flutter projects.
      # ============================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'  # Eclipse Temurin is a popular JDK distribution
          java-version: '17'        # Java version 17

      # ============================================
      # Step 4: Set up Flutter
      # ============================================
      # This action sets up the Flutter SDK on the runner.
      # We specify a stable version to ensure consistency.
      # The 'cache' parameter speeds up builds by caching Flutter dependencies.
      # ============================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'  # Specify Flutter version (use 'stable' for latest stable)
          channel: 'stable'          # Flutter channel: stable, beta, or dev
          cache: true                # Cache Flutter pub dependencies to speed up builds

      # ============================================
      # Step 5: Display Flutter version
      # ============================================
      # This verifies that Flutter is correctly installed and shows the version.
      # It's good practice to verify tools before using them.
      # ============================================
      - name: Display Flutter version
        run: |
          echo "=========================================="
          echo "STEP: Displaying Flutter Version"
          echo "=========================================="
          flutter --version
          echo ""
          echo "=========================================="

      # ============================================
      # Step 6: Install Flutter dependencies
      # ============================================
      # 'flutter pub get' downloads all the packages listed in pubspec.yaml.
      # This is equivalent to running 'npm install' in Node.js projects.
      # ============================================
      - name: Install Flutter dependencies
        run: |
          echo "=========================================="
          echo "STEP: Installing Flutter Dependencies"
          echo "=========================================="
          flutter pub get
          echo ""
          echo "Dependencies installed successfully!"
          echo "=========================================="

      # ============================================
      # Step 7: Build debug APK
      # ============================================
      # This builds a debug APK of the Flutter app.
      # --debug: Build a debug version (faster, not optimized)
      # --release: Would build a release version (slower, optimized)
      # The APK will be created in: build/app/outputs/flutter-apk/
      # ============================================
      - name: Build debug APK
        run: |
          echo "=========================================="
          echo "STEP: Building Debug APK"
          echo "=========================================="
          flutter build apk --debug
          echo ""
          echo "APK built successfully!"
          echo "=========================================="

      # ============================================
      # Step 8: Upload APK as artifact
      # ============================================
      # This uploads the built APK as a GitHub Actions artifact.
      # Artifacts are files that you can download from the Actions UI.
      # They persist for 90 days by default.
      # ============================================
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          # Name of the artifact (will appear in the Actions UI)
          name: debug-apk
          # Path to the APK file (using wildcard to match the actual file name)
          path: build/app/outputs/flutter-apk/app-debug.apk
          # Optional: Add a description for the artifact
          if-no-files-found: error  # Fail the step if no APK is found

      # ============================================
      # Step 9: Print completion message
      # ============================================
      # This provides a clear end marker for the workflow.
      # ============================================
      - name: Print completion message
        run: |
          echo "=========================================="
          echo "WORKFLOW COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo ""
          echo "What happened in this workflow:"
          echo "1. Checked out the repository"
          echo "2. Printed runner information"
          echo "3. Set up Java (required for Android builds)"
          echo "4. Set up Flutter SDK"
          echo "5. Displayed Flutter version"
          echo "6. Installed Flutter dependencies"
          echo "7. Built a debug APK"
          echo "8. Uploaded the APK as an artifact"
          echo ""
          echo "You can download the APK from the Actions tab!"
          echo "=========================================="
