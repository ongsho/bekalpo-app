name: Deploy to Play Store

on:
  push:
    branches: [main]   # অথবা আলাদা release branch যেটা আপনি নিয়ন্ত্রণ করেন

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Decode keystore
        run: |
          mkdir -p android/app/key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key/bekalpo-keystore.jks

      - name: Create key.properties
        run: |
          cat <<'EOF' > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key/bekalpo-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        run: flutter build appbundle --release

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.bekalpo.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: production          # প্রথমে এটা দিয়ে শুরু করুন — নিচে নোট দেখুন
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Send Discord Notification
        if: always()
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
              -H "Content-Type: application/json" \
              -d '{
                "content": "**Bekalpo App Deploy ${{ job.status }}**",
                "embeds": [{
                  "title": "Deploy Status: ${{ job.status }}",
                  "color": ${{ job.status == 'success' && 65280 || 16711680 }},
                  "fields": [
                    {"name": "Workflow", "value": "${{ github.workflow }}", "inline": true},
                    {"name": "Branch", "value": "${{ github.ref }}", "inline": true},
                    {"name": "Commit", "value": "${{ github.sha }}", "inline": true},
                    {"name": "Actor", "value": "${{ github.actor }}", "inline": true}
                  ],
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }]
              }'
          fi